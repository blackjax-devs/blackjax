exclude: |
    (?x)^(
        blackjax/_version\.py|
    )$
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    -   id: check-merge-conflict
    -   id: debug-statements
    -   id: end-of-file-fixer
    -   id: requirements-txt-fixer
    -   id: trailing-whitespace
- repo: local
  hooks:
    - id: mypy
      name: mypy (project env, real jax types)
      # mirrors-mypy runs in an isolated env with no jax/numpy installed, so
      # every jax type resolved to Any and the hook checked almost nothing
      # (Issue#1278). Running mypy inside the project's own uv env instead
      # checks against the real jax/numpy stubs.
      # pass_filenames: false + explicit targets (not per-changed-file) so
      # the hook always runs the exact invocation verified to be clean
      # (`mypy --config-file mypy.ini blackjax tests`), independent of which
      # files happen to be staged.
      entry: uv run --frozen mypy --config-file mypy.ini blackjax tests
      language: system
      pass_filenames: false
      types: [python]
      files: ^(blackjax|tests)/
      require_serial: true
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.10
  hooks:
    - id: ruff-check
      args: [--fix]
    - id: ruff-format
      # ruff-format's default types_or includes markdown; restrict to Python
      # to match the old black/isort/flake8 scope (never touched .md files,
      # some of which are Jupytext-synced notebooks).
      types_or: [python, pyi, jupyter]
- repo: https://github.com/jorisroovers/gitlint
  rev: v0.19.1
  hooks:
    - id: gitlint
    - id: gitlint-ci
