[mypy]
show_error_codes = True

# jax and numpy ship their own type stubs (py.typed), so they are checked
# against real types and do not need ignore_missing_imports. The packages
# below genuinely ship no stubs and no py.typed marker.

[mypy-chex.*]
ignore_missing_imports = True

[mypy-optax.*]
ignore_missing_imports = True

[mypy-scipy.*]
ignore_missing_imports = True

[mypy-tqdm.*]
ignore_missing_imports = True

[mypy-setup]
ignore_errors = True

[mypy-versioneer]
check_untyped_defs = False
